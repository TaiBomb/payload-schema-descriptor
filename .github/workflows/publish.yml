name: publish

# Publishes to npm when a vX.Y.Z tag is pushed:
#
#   npm version patch && git push --follow-tags
#
# Auth goes through npm trusted publishing (OIDC), so there's no npm token
# stored in the repo secrets.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      # prepublishOnly runs typecheck + tests, prepack runs the build
      - run: npm publish
